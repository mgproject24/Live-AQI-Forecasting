name: Weekly hyperparameter tuning

on:
  schedule:
    - cron: "0 2 * * 0"   # Sunday 07:30 IST, ahead of the day's ingest/retrain
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python src/tune.py

      - name: Commit updated hyperparameters
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          git add models/best_params.json
          git diff --cached --quiet || git commit -m "Weekly hyperparameter tuning [skip ci]"
          git push
