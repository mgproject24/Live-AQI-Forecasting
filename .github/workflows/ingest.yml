name: Daily data ingest

on:
  schedule:
    - cron: "0 3 * * *"   # 08:30 IST every day
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python src/ingest.py

      - name: Commit updated data
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily data update [skip ci]"
          git push
